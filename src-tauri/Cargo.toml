[package]
name = "d2_hub"
version = "1.1.5"
edition = "2021"
authors = ["Awoke"]
description = "D2 Hub - Destiny 2 Desktop Companion App"
default-run = "d2_hub"
autobins = false

[lib]
name = "d2_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opener = "0.7"
notify = "6"
chrono = "0.4"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "http2", "charset"] }
strsim = "0.11"
xcap = "0.7"
windows = { version = "0.62", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Globalization",
    "Security_Cryptography",
] }
base64 = "0.22"
image = "0.25"
bs58 = "0.5"

[[bin]]
name = "d2_hub_git_push"
path = "src/git_push.rs"

[[bin]]
name = "d2_hub"
path = "src/main.rs"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = true
